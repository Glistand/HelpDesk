syntax = "proto3";

package helpdesk.conversation.v1;

option go_package = "github.com/Glistand/HelpDesk/api/gen/go/helpdesk/conversation/v1;conversationv1";

// ConversationService is the sync API for support chat threads.
service ConversationService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc RequestHuman(RequestHumanRequest) returns (RequestHumanResponse);
  rpc ResolveConversation(ResolveConversationRequest) returns (ResolveConversationResponse);
}

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_BOT = 1;
  CONVERSATION_STATUS_WAITING_AGENT = 2;
  CONVERSATION_STATUS_OPEN = 3;
  CONVERSATION_STATUS_RESOLVED = 4;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_VISITOR = 1;
  MESSAGE_ROLE_BOT = 2;
  MESSAGE_ROLE_AGENT = 3;
  MESSAGE_ROLE_SYSTEM = 4;
}

message Conversation {
  string id = 1;
  string site_key = 2;
  string visitor_id = 3;
  ConversationStatus status = 4;
  string assignee_id = 5;
  string preview = 6;
  string created_at = 7;
  string updated_at = 8;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  MessageRole role = 3;
  string body = 4;
  string author_id = 5;
  string created_at = 6;
}

message CreateConversationRequest {
  string site_key = 1;
  string visitor_id = 2;
}

message CreateConversationResponse {
  Conversation conversation = 1;
  repeated Message messages = 2;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message ListConversationsRequest {
  ConversationStatus status = 1;
  int32 page_size = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message PostMessageRequest {
  string conversation_id = 1;
  MessageRole role = 2;
  string body = 3;
  string author_id = 4;
  // When true and role=VISITOR, conversation-service calls the LLM for a bot reply.
  bool invoke_bot = 5;
}

message PostMessageResponse {
  Message message = 1;
  Message bot_reply = 2;
  Conversation conversation = 3;
}

message ListMessagesRequest {
  string conversation_id = 1;
  string after_id = 2;
}

message ListMessagesResponse {
  repeated Message messages = 1;
}

message RequestHumanRequest {
  string conversation_id = 1;
}

message RequestHumanResponse {
  Conversation conversation = 1;
  Message system_message = 2;
}

message ResolveConversationRequest {
  string id = 1;
}

message ResolveConversationResponse {
  Conversation conversation = 1;
}
