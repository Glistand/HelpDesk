name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            file: services/auth-service/Dockerfile
          - name: ticket-service
            context: .
            file: services/ticket-service/Dockerfile
          - name: assignment-service
            context: .
            file: services/assignment-service/Dockerfile
          - name: notification-service
            context: .
            file: services/notification-service/Dockerfile
          - name: audit-service
            context: .
            file: services/audit-service/Dockerfile
          - name: sla-service
            context: .
            file: services/sla-service/Dockerfile
          - name: escalation-service
            context: .
            file: services/escalation-service/Dockerfile
          - name: search-service
            context: .
            file: services/search-service/Dockerfile
          - name: conversation-service
            context: .
            file: services/conversation-service/Dockerfile
          - name: project-service
            context: .
            file: services/project-service/Dockerfile
          - name: api-gateway
            context: .
            file: services/api-gateway/Dockerfile
          - name: web
            context: apps/web
            file: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/helpdesk-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
