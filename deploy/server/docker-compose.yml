# HelpDesk — standalone server stack (ONLY these 2 files needed: this + .env)
#
#   docker login ghcr.io -u USER --password-stdin   # if packages are private
#   docker compose --env-file .env up -d
#
# Public ports: WEB_PORT (UI), GATEWAY_PORT (API). Nothing else is published.
# Login: agent@helpdesk.local / password

name: helpdesk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  pull_policy: ${PULL_POLICY:-always}
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # Creates per-service databases (idempotent). No host files required.
  postgres-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for db in auth ticket assignment sla escalation notification audit conversation project; do
          exists=$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" != "1" ]; then
            echo "Creating database $$db"
            psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE $$db;"
          else
            echo "Database $$db already exists"
          fi
        done
        echo "Postgres databases ready"
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # Creates JetStream streams (idempotent). Script is inline — no host files.
  nats-init:
    image: natsio/nats-box:0.18.0
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Waiting for NATS at $$NATS_URL..."
        until nats --server "$$NATS_URL" server check connection >/dev/null 2>&1; do sleep 1; done
        if ! nats --server "$$NATS_URL" stream info HELP_DESK_EVENTS >/dev/null 2>&1; then
          nats --server "$$NATS_URL" stream add HELP_DESK_EVENTS \
            --subjects "helpdesk.ticket.>" \
            --subjects "helpdesk.sla.>" \
            --subjects "helpdesk.assignment.>" \
            --subjects "helpdesk.notification.>" \
            --subjects "helpdesk.audit.>" \
            --storage file --retention limits --max-msgs=-1 --max-age=720h --dupe-window=2m --defaults
        else
          echo "HELP_DESK_EVENTS exists"
        fi
        if ! nats --server "$$NATS_URL" stream info HELP_DESK_DLQ >/dev/null 2>&1; then
          nats --server "$$NATS_URL" stream add HELP_DESK_DLQ \
            --subjects "helpdesk.dlq.>" \
            --storage file --retention limits --max-msgs=-1 --max-age=168h --defaults
        else
          echo "HELP_DESK_DLQ exists"
        fi
        nats --server "$$NATS_URL" stream ls
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    logging: *default-logging

  auth-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-auth-service:${IMAGE_TAG}
    depends_on:
      - jaeger
    environment:
      AUTH_GRPC_ADDR: ":50051"
      JWT_SECRET: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: auth-service

  ticket-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-ticket-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      TICKET_GRPC_ADDR: ":50052"
      TICKET_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable
      NATS_URL: nats://nats:4222
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ticket-service

  assignment-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-assignment-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
    environment:
      ASSIGNMENT_GRPC_ADDR: ":50053"
      ASSIGNMENT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/assignment?sslmode=disable
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: assignment-service

  notification-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-notification-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      NOTIFICATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notification-service

  audit-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-audit-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      AUDIT_GRPC_ADDR: ":50054"
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/audit?sslmode=disable
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: audit-service

  sla-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-sla-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      SLA_GRPC_ADDR: ":50055"
      SLA_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sla?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      SLA_FIRST_RESPONSE: ${SLA_FIRST_RESPONSE:-5m}
      SLA_RESOLVE: ${SLA_RESOLVE:-30m}
      SLA_WARN_RATIO: ${SLA_WARN_RATIO:-0.5}
      SLA_POLL_INTERVAL: ${SLA_POLL_INTERVAL:-1s}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: sla-service

  escalation-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-escalation-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
      sla-service:
        condition: service_started
    environment:
      ESCALATION_GRPC_ADDR: ":50056"
      ESCALATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/escalation?sslmode=disable
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      ESCALATION_L2_ASSIGNEE: ${ESCALATION_L2_ASSIGNEE:-a-3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: escalation-service

  search-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-search-service:${IMAGE_TAG}
    depends_on:
      meilisearch:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
    environment:
      SEARCH_GRPC_ADDR: ":50057"
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX: tickets
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: search-service

  conversation-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-conversation-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      CONVERSATION_GRPC_ADDR: ":50058"
      CONVERSATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/conversation?sslmode=disable
      NATS_URL: nats://nats:4222
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash-vl:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: conversation-service

  api-gateway:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-api-gateway:${IMAGE_TAG}
    depends_on:
      - auth-service
      - ticket-service
      - assignment-service
      - audit-service
      - sla-service
      - search-service
      - conversation-service
      - project-service
      - jaeger
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      AUTH_GRPC_ADDR: auth-service:50051
      TICKET_GRPC_ADDR: ticket-service:50052
      ASSIGNMENT_GRPC_ADDR: assignment-service:50053
      AUDIT_GRPC_ADDR: audit-service:50054
      SLA_GRPC_ADDR: sla-service:50055
      SEARCH_GRPC_ADDR: search-service:50057
      CONVERSATION_GRPC_ADDR: conversation-service:50058
      PROJECT_GRPC_ADDR: project-service:50059
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  project-service:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-project-service:${IMAGE_TAG}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      PROJECT_GRPC_ADDR: ":50059"
      PROJECT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/project?sslmode=disable
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      PROJECT_NAME: ${PROJECT_NAME:-SalonPro}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION:-}
      PROJECT_DOMAIN: ${PROJECT_DOMAIN:-}
      PROJECT_WEBSITE_URL: ${PROJECT_WEBSITE_URL:-}
      PROJECT_SUPPORT_EMAIL: ${PROJECT_SUPPORT_EMAIL:-}
      PROJECT_SUPPORT_PHONE: ${PROJECT_SUPPORT_PHONE:-}
      PROJECT_TIMEZONE: ${PROJECT_TIMEZONE:-Europe/Moscow}
      PROJECT_BOT_INSTRUCTIONS: ${PROJECT_BOT_INSTRUCTIONS:-}
      PROJECT_AUTO_CREATE_TICKET: ${PROJECT_AUTO_CREATE_TICKET:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: project-service

  web:
    <<: *app
    image: ghcr.io/${GHCR_OWNER}/helpdesk-web:${IMAGE_TAG}
    depends_on:
      - api-gateway
    environment:
      GATEWAY_URL: http://api-gateway:8080
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-80}:3000"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  meili_data:
