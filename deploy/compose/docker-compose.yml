name: helpdesk

services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helpdesk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: helpdesk-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-sd"
      - "/data"
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats-init:
    image: natsio/nats-box:0.18.0
    container_name: helpdesk-nats-init
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./init/nats:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-streams.sh"]
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: helpdesk-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: helpdesk-auth
    environment:
      AUTH_GRPC_ADDR: ":50051"
      JWT_SECRET: ${JWT_SECRET:-helpdesk-dev-secret-change-me}
    ports:
      - "${AUTH_GRPC_PORT:-50051}:50051"
    restart: unless-stopped

  ticket-service:
    build:
      context: ../..
      dockerfile: services/ticket-service/Dockerfile
    container_name: helpdesk-ticket
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      TICKET_GRPC_ADDR: ":50052"
      TICKET_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable
      NATS_URL: nats://nats:4222
      OUTBOX_POLL_INTERVAL: 500ms
    ports:
      - "${TICKET_GRPC_PORT:-50052}:50052"
    restart: unless-stopped

  assignment-service:
    build:
      context: ../..
      dockerfile: services/assignment-service/Dockerfile
    container_name: helpdesk-assignment
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
    environment:
      ASSIGNMENT_GRPC_ADDR: ":50053"
      ASSIGNMENT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/assignment?sslmode=disable
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
    ports:
      - "${ASSIGNMENT_GRPC_PORT:-50053}:50053"
    restart: unless-stopped

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: helpdesk-notification
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      NOTIFICATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable
      NATS_URL: nats://nats:4222
    restart: unless-stopped

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    container_name: helpdesk-audit
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      AUDIT_GRPC_ADDR: ":50054"
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/audit?sslmode=disable
      NATS_URL: nats://nats:4222
    ports:
      - "${AUDIT_GRPC_PORT:-50054}:50054"
    restart: unless-stopped

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: helpdesk-gateway
    depends_on:
      - auth-service
      - ticket-service
      - assignment-service
      - audit-service
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      AUTH_GRPC_ADDR: auth-service:50051
      TICKET_GRPC_ADDR: ticket-service:50052
      ASSIGNMENT_GRPC_ADDR: assignment-service:50053
      AUDIT_GRPC_ADDR: audit-service:50054
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  meili_data:
