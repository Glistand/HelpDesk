name: helpdesk

services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helpdesk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: helpdesk-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-sd"
      - "/data"
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats-init:
    image: natsio/nats-box:0.18.0
    container_name: helpdesk-nats-init
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./init/nats:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-streams.sh"]
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: helpdesk-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: helpdesk-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: helpdesk-auth
    environment:
      AUTH_GRPC_ADDR: ":50051"
      JWT_SECRET: ${JWT_SECRET:-helpdesk-dev-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: auth-service
    ports:
      - "${AUTH_GRPC_PORT:-50051}:50051"
    restart: unless-stopped

  ticket-service:
    build:
      context: ../..
      dockerfile: services/ticket-service/Dockerfile
    container_name: helpdesk-ticket
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      TICKET_GRPC_ADDR: ":50052"
      TICKET_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable
      NATS_URL: nats://nats:4222
      OUTBOX_POLL_INTERVAL: 500ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ticket-service
    ports:
      - "${TICKET_GRPC_PORT:-50052}:50052"
    restart: unless-stopped

  assignment-service:
    build:
      context: ../..
      dockerfile: services/assignment-service/Dockerfile
    container_name: helpdesk-assignment
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
    environment:
      ASSIGNMENT_GRPC_ADDR: ":50053"
      ASSIGNMENT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/assignment?sslmode=disable
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: assignment-service
    ports:
      - "${ASSIGNMENT_GRPC_PORT:-50053}:50053"
    restart: unless-stopped

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: helpdesk-notification
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      NOTIFICATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notification-service
    restart: unless-stopped

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    container_name: helpdesk-audit
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      AUDIT_GRPC_ADDR: ":50054"
      AUDIT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/audit?sslmode=disable
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: audit-service
    ports:
      - "${AUDIT_GRPC_PORT:-50054}:50054"
    restart: unless-stopped

  sla-service:
    build:
      context: ../..
      dockerfile: services/sla-service/Dockerfile
    container_name: helpdesk-sla
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      SLA_GRPC_ADDR: ":50055"
      SLA_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sla?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      # Short timers for local/e2e; override in .env for longer policies.
      SLA_FIRST_RESPONSE: ${SLA_FIRST_RESPONSE:-5s}
      SLA_RESOLVE: ${SLA_RESOLVE:-30s}
      SLA_WARN_RATIO: ${SLA_WARN_RATIO:-0.5}
      SLA_POLL_INTERVAL: 200ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: sla-service
    ports:
      - "${SLA_GRPC_PORT:-50055}:50055"
    restart: unless-stopped

  escalation-service:
    build:
      context: ../..
      dockerfile: services/escalation-service/Dockerfile
    container_name: helpdesk-escalation
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
      sla-service:
        condition: service_started
    environment:
      ESCALATION_GRPC_ADDR: ":50056"
      ESCALATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/escalation?sslmode=disable
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      ESCALATION_L2_ASSIGNEE: a-3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: escalation-service
    ports:
      - "${ESCALATION_GRPC_PORT:-50056}:50056"
    restart: unless-stopped

  search-service:
    build:
      context: ../..
      dockerfile: services/search-service/Dockerfile
    container_name: helpdesk-search
    depends_on:
      meilisearch:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ticket-service:
        condition: service_started
    environment:
      SEARCH_GRPC_ADDR: ":50057"
      TICKET_GRPC_ADDR: ticket-service:50052
      NATS_URL: nats://nats:4222
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_INDEX: tickets
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: search-service
    ports:
      - "${SEARCH_GRPC_PORT:-50057}:50057"
    restart: unless-stopped

  conversation-service:
    build:
      context: ../..
      dockerfile: services/conversation-service/Dockerfile
    container_name: helpdesk-conversation
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      CONVERSATION_GRPC_ADDR: ":50058"
      CONVERSATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/conversation?sslmode=disable
      NATS_URL: nats://nats:4222
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash-vl:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: conversation-service
    ports:
      - "${CONVERSATION_GRPC_PORT:-50058}:50058"
    restart: unless-stopped

  project-service:
    build:
      context: ../..
      dockerfile: services/project-service/Dockerfile
    container_name: helpdesk-project
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      PROJECT_GRPC_ADDR: ":50059"
      PROJECT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/project?sslmode=disable
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      PROJECT_NAME: ${PROJECT_NAME:-SalonPro}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION:-}
      PROJECT_DOMAIN: ${PROJECT_DOMAIN:-}
      PROJECT_WEBSITE_URL: ${PROJECT_WEBSITE_URL:-}
      PROJECT_SUPPORT_EMAIL: ${PROJECT_SUPPORT_EMAIL:-}
      PROJECT_SUPPORT_PHONE: ${PROJECT_SUPPORT_PHONE:-}
      PROJECT_TIMEZONE: ${PROJECT_TIMEZONE:-Europe/Moscow}
      PROJECT_BOT_INSTRUCTIONS: ${PROJECT_BOT_INSTRUCTIONS:-}
      PROJECT_AUTO_CREATE_TICKET: ${PROJECT_AUTO_CREATE_TICKET:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: project-service
    ports:
      - "${PROJECT_GRPC_PORT:-50059}:50059"
    restart: unless-stopped

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: helpdesk-gateway
    depends_on:
      - auth-service
      - ticket-service
      - assignment-service
      - audit-service
      - sla-service
      - search-service
      - conversation-service
      - project-service
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      AUTH_GRPC_ADDR: auth-service:50051
      TICKET_GRPC_ADDR: ticket-service:50052
      ASSIGNMENT_GRPC_ADDR: assignment-service:50053
      AUDIT_GRPC_ADDR: audit-service:50054
      SLA_GRPC_ADDR: sla-service:50055
      SEARCH_GRPC_ADDR: search-service:50057
      CONVERSATION_GRPC_ADDR: conversation-service:50058
      PROJECT_GRPC_ADDR: project-service:50059
      WIDGET_SITE_KEY: ${WIDGET_SITE_KEY:-demo-site}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: api-gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: helpdesk-web
    depends_on:
      - api-gateway
    environment:
      GATEWAY_URL: http://api-gateway:8080
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  meili_data:
